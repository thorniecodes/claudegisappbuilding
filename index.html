<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>20x21EUG Mural Tour</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#E8401C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <a href="#map" class="skip-link">Skip to map</a>

  <header id="app-header">
    <span class="header-logo">20x21EUG</span>
    <span id="visited-counter" class="visited-counter" aria-live="polite">0 / 24 visited</span>
    <button id="filter-btn" class="icon-btn" aria-label="Open filters">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="2" y1="5" x2="18" y2="5"/><line x1="5" y1="10" x2="15" y2="10"/><line x1="8" y1="15" x2="12" y2="15"/>
      </svg>
      Filters
    </button>
  </header>

  <div id="tour-progress" class="hidden" aria-live="polite">
    <span id="tour-progress-text"></span>
    <div class="tour-nav">
      <button id="tour-prev" aria-label="Previous stop">&#8592; Prev</button>
      <button id="tour-next" aria-label="Next stop">Next &#8594;</button>
      <button id="tour-exit" aria-label="Exit tour">&#10005; Exit Tour</button>
    </div>
  </div>

  <main id="map">
    <div id="map-loading" role="status" aria-live="polite" aria-label="Loading mural data">
      <div class="spinner"></div>
      <p>Loading murals&hellip;</p>
    </div>
  </main>

  <div id="fab-area">
    <button id="btn-near-me" class="fab" aria-label="Show my location on the map">Near Me</button>
    <button id="btn-tour" class="fab" aria-label="Start a guided tour">Tour</button>
  </div>

  <!-- Mobile bottom drawer -->
  <div id="drawer" role="region" aria-label="Mural details">
    <div class="drawer-handle" aria-hidden="true"></div>
    <div id="drawer-content" aria-live="polite"></div>
  </div>

  <!-- Desktop sidebar -->
  <aside id="sidebar" aria-label="Mural details">
    <div class="sidebar-top">
      <div class="sidebar-logo-row">
        <span class="header-logo">20x21EUG Mural Tour</span>
      </div>
      <div id="sidebar-filter-section"></div>
    </div>
    <div id="sidebar-content" aria-live="polite">
      <div class="sidebar-empty">
        <p>Select a mural on the map to learn more.</p>
      </div>
    </div>
  </aside>

  <!-- Mobile filter panel -->
  <div id="filter-panel" role="dialog" aria-label="Filter murals" aria-modal="true" aria-hidden="true">
    <div class="filter-panel-header">
      <h2>Filters</h2>
      <button id="filter-close" class="icon-btn" aria-label="Close filters">&#10005;</button>
    </div>
    <div id="filter-panel-body" class="filter-panel-body"></div>
    <div class="filter-panel-footer">
      <button id="filter-clear">Clear all filters</button>
    </div>
  </div>
  <div id="filter-overlay" class="overlay hidden" aria-hidden="true"></div>

  <!-- Tour selection sheet -->
  <div id="tour-sheet" role="dialog" aria-label="Select a tour loop" aria-modal="true" aria-hidden="true">
    <div class="tour-sheet-header">
      <h2>Choose a Loop</h2>
      <button id="tour-sheet-close" class="icon-btn" aria-label="Close tour selection">&#10005;</button>
    </div>
    <div id="tour-cards"></div>
  </div>
  <div id="tour-overlay" class="overlay hidden" aria-hidden="true"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
